# Pre-commit hooks: run the cheap quality gates locally before CI does.
#
# Install once after cloning:
#     uv run pre-commit install
# After that, every `git commit` runs:
#     - hygiene (trailing whitespace, EOF, large files, valid YAML/TOML/JSON)
#     - 150-line cap check (Guidelines V3 §5.2)
#     - ruff (Guidelines V3 §7) with --fix so easy issues are auto-corrected
#
# pytest is intentionally NOT in the per-commit hooks: 91 tests on a
# laptop runs in ~3 seconds but feels too long per save. CI / `make ci`
# runs the full suite on every push.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: line-cap-150
        name: 150-line raw-line cap (Guidelines V3 §5.2)
        entry: python scripts/check_line_cap.py
        language: system
        pass_filenames: false
        files: ^src/.+\.py$

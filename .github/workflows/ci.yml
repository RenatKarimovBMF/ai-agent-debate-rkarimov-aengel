# Continuous Integration: lint + line-cap + tests on every push and PR.
#
# Mirrors the gates required by Exercise 02 / Guidelines V3:
#   - ruff is clean (zero violations) on src/, tests/, scripts/
#   - every .py under src/, tests/, scripts/ is <= 150 raw lines (NFR-01)
#   - pytest tests/unit passes with fail_under = 100 on in-scope code
#   - the CLI dry-run prints a healthy banner without contacting an LLM
#
# Integration tests under tests/integration/ are intentionally skipped
# here: they require real GEMINI_API_KEY / ANTHROPIC_API_KEY values and
# spawn child processes that the public CI runner cannot reach.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify the 150-line cap (NFR-01)
        run: uv run python scripts/check_line_cap.py

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ scripts/

      - name: Unit tests with coverage gate (fail_under = 100)
        run: uv run pytest tests/unit --cov --cov-report=term --cov-report=xml

      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: CLI smoke (no LLM call)
        run: |
          uv run python -m debate.main --version
          uv run python -m debate.main --help

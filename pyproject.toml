[project]
name = "ai-agent-debate"
version = "1.10"
description = "Exercise 02 — a topic-agnostic mediated AI debate engine (default topic: The Godfather vs The Shawshank Redemption)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Renat Karimov" },
    { name = "Alon Engel" },
]
dependencies = [
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
debate = "debate.main:main"
debate-gui = "debate.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/debate", "src/sdk"]

[tool.hatch.build.targets.wheel.force-include]
"src/debate" = "debate"
"src/sdk" = "sdk"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/debate", "src/sdk"]
# No omit entries: every runtime module under src/ is covered by real
# tests. The former manual Gemini smoke script lives in
# scripts/manual_gemini_check.py (outside the coverage source tree).
omit = []

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true

# The Tk GUI is optional and Tk's stubs are noisy/low-value to satisfy;
# type-check the core logic and scope the GUI package out of errors.
[[tool.mypy.overrides]]
module = "debate.gui.*"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

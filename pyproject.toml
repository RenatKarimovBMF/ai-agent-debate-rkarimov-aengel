[project]
name = "ai-agent-debate"
version = "0.1.0"
description = "Exercise 02 — mediated AI debate: The Godfather vs The Shawshank Redemption"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Renat Karimov" },
    { name = "Alon Engel" },
]
dependencies = [
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
debate = "debate.main:main"
debate-gui = "debate.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/debate", "src/sdk"]

[tool.hatch.build.targets.wheel.force-include]
"src/debate" = "debate"
"src/sdk" = "sdk"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

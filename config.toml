[debate]
topic = "Which is the greater film: The Godfather (1972) or The Shawshank Redemption (1994)?"
pro_side = "The Godfather"
con_side = "The Shawshank Redemption"
language = "en"

# The exercise prefers 10, but allows reducing to 5 when API budget is limited,
# if you explicitly document this in README.
pings_per_side = 5

max_words_per_turn = 280
request_timeout_seconds = 120
keepalive_interval_seconds = 30

[llm]
gemini_model = "gemini-2.5-flash"
gemini_model_fallbacks = ["gemini-2.0-flash-lite", "gemini-1.5-flash"]

# For final submission run, keep true because the exercise requires internet sources.
# If Gemini blocks Google Search grounding on your free tier, set false and clearly
# explain the limitation in README.
use_google_search = true

[agents]
cli_command = "claude"
workdir = "."

[ipc]
fifo_dir = "fifo"

# Safer default for Windows/Linux grading.
# Use "fifo" only if you really run separate Unix processes.
transport_type = "file_queue"

pro_to_parent = "pro_to_parent.fifo"
con_to_parent = "con_to_parent.fifo"
parent_to_pro = "parent_to_pro.fifo"
parent_to_con = "parent_to_con.fifo"

[logging]
log_dir = "logs"
max_files = 20
max_lines_per_file = 500
level = "INFO"

[gatekeeper]
enabled = true
max_total_requests = 200
max_requests_per_agent = 80